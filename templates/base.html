<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Career Guide & Resume Analyzer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="container navbar">
            <a href="{{ url_for('index') }}" class="brand">AI Career Guide</a>
            <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
            <nav class="nav-links">
                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('career_guide') }}">Career Guide</a>
                <a href="{{ url_for('resume_analyzer') }}">Resume Analyzer</a>
                <a href="{{ url_for('interview_page') }}">Interview</a>
                <a href="{{ url_for('mock_page') }}">Mock Interview</a>
                <a href="{{ url_for('project_analyzer') }}">Project Analyzer</a>
            </nav>
        </div>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>AI Career Guide & Resume Analyzer</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
